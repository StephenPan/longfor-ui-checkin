name: Source and privacy checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s longfor-wechat-checkin -p "test_*.py"
      - run: python -m unittest discover -s longfor-android-checkin -p "test_*.py"
      - run: python -m unittest test_privacy.py
      - shell: powershell
        run: ./longfor-wechat-checkin/build.ps1
      - run: python privacy_check.py
